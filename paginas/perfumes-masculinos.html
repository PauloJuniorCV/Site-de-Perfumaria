<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Essence</title>

    <style>
        :root {
            --principal: #141414;
            --secundaria: #C9A96E;
            --texto: #F5F0E8;
        }

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            background-color: var(--principal);
            height: 70px;
            display: flex;
            flex-direction: row;
            align-items: center;
            
        }

        header * {
            color: var(--texto);
            margin: 0px 30px 0px 30px;
        }

        a {
            text-decoration: none;
        }

        #grupoVip {
            background-color: var(--secundaria);
            color: var(--principal);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px;
            height: 30px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            AURA ESSENCE
        </div>
        <nav>
            <a href="">Início</a>
            <a href="">Masculinos</a>
            <a href="">Femininos</a>
            <a href="">Unissex</a>
            <select name="Coleções">
                <option value="Edição Limitada">Edição Limitada</option>
                <option value="Best-Sellers">Best-Sellers</option>
                <option value="Kits para Presente">Kits para Presente</option>
            </select>
        </nav>
        <a id="grupoVip" href="">Club VIP</a>
    </header>
</body>

</html>
